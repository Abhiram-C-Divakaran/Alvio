name: Alvio CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Build & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      GROQ_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Security Audit (high/critical)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Validate Linux deployment shell scripts
        run: bash -n deploy/setup-api-host.sh deploy/setup-judge-host.sh deploy/run-backup.sh deploy/health-monitor.sh deploy/validate-deployment.sh deploy/rollback-judge.sh

      - name: TypeScript type check (app, node config, server & judge worker)
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit
          npx tsc --ignoreConfig --noEmit --allowImportingTsExtensions --module esnext --moduleResolution bundler --target es2023 --esModuleInterop --skipLibCheck server.ts server/seedHiddenTests.ts server/hiddenTestCoverage.ts server/validateEnv.ts judge-worker/server.ts

      - name: Production Build
        run: npm run build

      - name: Backend Foundation & Security Tests
        run: npm run test:foundation

      - name: Domain Model Unit Tests
        run: npm run test:models

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser Auth Foundation Tests
        run: npm run test:auth-browser

      - name: Browser Auth & Coding Regressions
        run: npm run test:auth-regressions

      - name: Browser Learning Regressions
        run: npm run test:learning-browser

      - name: Browser Practice Regressions
        run: npm run test:practice-browser

  live-docker-judge:
    name: Live Linux Docker Judge Verification (All 7 Languages & Security Controls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build judge-worker Docker image
        run: docker build -f judge-worker/Dockerfile -t alvio-judge-worker:ci .

      - name: Pre-pull pinned language runtime images
        run: |
          docker pull node:22-alpine
          docker pull python:3.12-alpine
          docker pull gcc:14-bookworm
          docker pull eclipse-temurin:21-jdk-alpine
          docker pull mono:6.12

      - name: Run live Linux Docker judge integration & security suite (runc)
        run: npm run test:judge-live-docker

  live-gvisor-judge:
    name: Live Linux gVisor (runsc) Judge Verification (All 7 Languages & Security Controls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      JUDGE_DOCKER_RUNTIME: runsc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install and register official gVisor (runsc) Docker runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update && sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format 'Server={{.ServerVersion}} Runtimes={{range $k, $v := .Runtimes}}{{$k}} {{end}}'

      - name: Pre-pull pinned language runtime images
        run: |
          docker pull node:22-alpine
          docker pull python:3.12-alpine
          docker pull gcc:14-bookworm
          docker pull eclipse-temurin:21-jdk-alpine
          docker pull mono:6.12

      - name: Run live Linux gVisor (runsc) judge integration & security suite
        run: npm run test:judge-live-docker

      - name: Run live Ubuntu Linux operational drill (production API + gVisor worker + backup/restore + health monitor + rollback)
        run: |
          npm run build
          DRILL_DIR="$(mktemp -d)"
          trap 'kill "${API_PID:-}" "${JUDGE_PID:-}" 2>/dev/null || true; rm -rf "${DRILL_DIR}"' EXIT
          DB_PATH="${DRILL_DIR}/staging.sqlite"
          BACKUP_DIR="${DRILL_DIR}/backups"
          ENV_FILE="${DRILL_DIR}/api.env"
          JWT_SECRET="$(node -e "console.log(require('node:crypto').randomBytes(48).toString('hex'))")"
          JUDGE_TOKEN="$(node -e "console.log(require('node:crypto').randomBytes(48).toString('hex'))")"

          DATABASE_PATH="${DB_PATH}" npx tsx server/migrateProblems.ts
          cat > "${ENV_FILE}" <<EOF
          NODE_ENV=production
          PORT=3101
          DATABASE_PATH=${DB_PATH}
          JWT_SECRET=${JWT_SECRET}
          ALLOWED_ORIGINS=https://staging.alvio.example.com
          COOKIE_SECURE=true
          TRUST_PROXY=true
          RATE_LIMIT_STORE=sqlite
          JUDGE_PROVIDER=isolated
          ISOLATED_JUDGE_URL=http://127.0.0.1:4105
          ISOLATED_JUDGE_TOKEN=${JUDGE_TOKEN}
          EOF

          set -a; source "${ENV_FILE}"; set +a
          npm run ops:check-env

          JUDGE_WORKER_HOST=127.0.0.1 JUDGE_WORKER_PORT=4105 JUDGE_DOCKER_RUNTIME=runsc ISOLATED_JUDGE_TOKEN="${JUDGE_TOKEN}" \
            npx tsx judge-worker/server.ts >"${DRILL_DIR}/judge.log" 2>&1 &
          JUDGE_PID=$!
          node dist/server.cjs >"${DRILL_DIR}/api.log" 2>&1 &
          API_PID=$!

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4105/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:3101/api/ready >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          ALVIO_APP_DIR="${PWD}" DATABASE_PATH="${DB_PATH}" BACKUP_DIR="${BACKUP_DIR}" bash deploy/run-backup.sh
          LATEST_SNAP="$(find "${BACKUP_DIR}" -maxdepth 1 -name 'alvio-*.sqlite' | head -n 1)"
          test -n "${LATEST_SNAP}"
          PERMS="$(stat -c '%a' "${LATEST_SNAP}")"
          echo "Verified backup snapshot permissions: ${PERMS}"
          test "${PERMS}" = "600"

          npm run db:restore -- "${LATEST_SNAP}" "${DRILL_DIR}/restored.sqlite"

          ALVIO_API_URL=http://127.0.0.1:3101 ISOLATED_JUDGE_URL=http://127.0.0.1:4105 \
            CHECK_LOCAL_DOCKER=true DATABASE_PATH="${DB_PATH}" CHECK_BACKUP_DIR="${BACKUP_DIR}" \
            bash deploy/health-monitor.sh

          ALVIO_PUBLIC_URL=http://127.0.0.1:3101 ISOLATED_JUDGE_URL=http://127.0.0.1:4105 \
            EXPECT_HTTPS=false bash deploy/validate-deployment.sh

          bash deploy/rollback-judge.sh --env-file "${ENV_FILE}" --no-restart
          grep -q '^JUDGE_PROVIDER=paiza$' "${ENV_FILE}"
          echo "PASS: Live Ubuntu operational, gVisor health, backup/restore, validation, and rollback drill complete."
