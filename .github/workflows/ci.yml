name: Alvio CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Build & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      GROQ_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Security Audit (high/critical)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript type check (app, node config, server & judge worker)
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit
          npx tsc --ignoreConfig --noEmit --module esnext --moduleResolution bundler --target es2023 --esModuleInterop --skipLibCheck server.ts server/seedHiddenTests.ts judge-worker/server.ts

      - name: Production Build
        run: npm run build

      - name: Backend Foundation & Security Tests
        run: npm run test:foundation

      - name: Domain Model Unit Tests
        run: npm run test:models

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser Auth Foundation Tests
        run: npm run test:auth-browser

      - name: Browser Auth & Coding Regressions
        run: npm run test:auth-regressions

      - name: Browser Learning Regressions
        run: npm run test:learning-browser

      - name: Browser Practice Regressions
        run: npm run test:practice-browser

  live-docker-judge:
    name: Live Linux Docker Judge Verification (All 7 Languages & Security Controls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build judge-worker Docker image
        run: docker build -f judge-worker/Dockerfile -t alvio-judge-worker:ci .

      - name: Pre-pull pinned language runtime images
        run: |
          docker pull node:22-alpine
          docker pull python:3.12-alpine
          docker pull gcc:14-bookworm
          docker pull eclipse-temurin:21-jdk-alpine
          docker pull mono:6.12-slim

      - name: Run live Linux Docker judge integration & security suite
        run: npm run test:judge-live-docker
