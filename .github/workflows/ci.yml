name: Alvio CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Build & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      GROQ_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build & Backend Foundation Tests
        run: npm run test:foundation

      - name: Domain Model Unit Tests
        run: npm run test:models

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser Auth Foundation Tests
        run: npm run test:auth-browser

      - name: Browser Auth & Coding Regressions
        run: npm run test:auth-regressions

      - name: Browser Learning Regressions
        run: npm run test:learning-browser

      - name: Browser Practice Regressions
        run: npm run test:practice-browser
